name: Radar Vinhos - Monitor de Anomalias

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-vinhos-monitor
  cancel-in-progress: false

jobs:
  executar-radar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Radar Vinhos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Persistir banco SQLite (radar_vinhos.db) no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f radar_vinhos.db ]; then
            git add radar_vinhos.db
            if ! git diff --staged --quiet; then
              git commit -m "chore(db): atualiza histórico de preços e alertas [skip ci]"
              git pull --rebase origin ${{ github.ref_name }}
              git push origin HEAD:${{ github.ref_name }}
            else
              echo "Nenhuma alteração em radar_vinhos.db para commitar."
            fi
          fi
